<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Space System Observer</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>Simulation Observer</h1>
          <p>Read-only backend panel for the authoritative tick loop</p>
        </div>
        <div class="status" id="connectionStatus">Connecting</div>
      </header>

      <section class="metrics" aria-label="Backend simulation metrics">
        <div>
          <span>Tick</span>
          <strong id="tick">0</strong>
        </div>
        <div>
          <span>Tick Rate</span>
          <strong id="tickRate">1s</strong>
        </div>
        <div>
          <span>User Clients</span>
          <strong id="connectedUserCount">0</strong>
        </div>
      </section>

      <section class="observer-grid" aria-label="Live observer telemetry">
        <section class="map-panel" aria-label="Connected user coordinate map">
          <header class="panel-header">
            <div>
              <h2>Coordinate Map</h2>
              <p>Live backend positions for connected user ships</p>
            </div>
            <span id="mapSummary">No ships</span>
          </header>
          <div class="observer-map" id="observerMap" aria-label="Connected user ship coordinates"></div>
        </section>

        <section class="events connected-panel" aria-label="Connected users">
          <h2>Connected Users</h2>
          <ul id="connectedUsers"></ul>
        </section>
      </section>

      <section class="planets" id="planets" aria-label="Observed planet markets"></section>

      <section class="details">
        <section class="events" aria-label="Player ship">
          <h2>Player Ships</h2>
          <ul id="playerShip"></ul>
        </section>

        <section class="events" aria-label="Recent events">
          <h2>Server Events</h2>
          <ul id="events"></ul>
        </section>
      </section>
    </main>

    <script type="module" src="/dist/app.js"></script>
  </body>
</html>
